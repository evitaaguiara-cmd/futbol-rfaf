name: Actualizar RFAF

on:
  schedule:
    - cron: '0 8,14,18,22 * * *'
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install requests beautifulsoup4

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Guardar datos nuevos
        run: |
          git config --global user.name "Robot RFAF"
          git config --global user.email "bot@rfaf.es"
          git add datos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Horarios actualizados" && git push)
